openapi: 3.1.0
info:
  title: GWRank Teambuilds API
  version: 1.0.0
  description: >
    Bibliothèque de teambuilds GWRank pour Z-Codex.
    Le payload est un document .zcx tel que défini normativement par
    docs/zcx_format.md (Z-Codex 1.2.0, version 18).
    Les clés sont strictement camelCase. Les skillId inconnus du catalogue
    sont préservés tels quels (jamais normalisés à 0).
servers:
  - url: https://gwrank.example.com
security:
  - bearerAuth: []
paths:
  /api/v1/teambuilds:
    get:
      summary: Rechercher des teambuilds
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Nom, insensible à la casse }
        - { name: "tags[]", in: query, schema: { type: array, items: { type: string } }, description: Recouvrement }
        - { name: profession_id, in: query, schema: { type: integer }, description: Profession primaire GW1 présente }
        - { name: elite_skill_id, in: query, schema: { type: integer } }
        - { name: campaign, in: query, schema: { type: string } }
        - { name: game_mode, in: query, schema: { type: string, enum: ["All", "PvE", "PvP", ""] } }
        - { name: player_count_min, in: query, schema: { type: integer, minimum: 1 } }
        - { name: player_count_max, in: query, schema: { type: integer, maximum: 12 } }
        - { name: visibility, in: query, schema: { type: string, enum: ["mine"] } }
        - { name: sort, in: query, schema: { type: string, enum: [updated_at, name, player_count] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Liste paginée de résumés
          content:
            application/json:
              schema:
                type: object
                properties:
                  teambuilds: { type: array, items: { $ref: "#/components/schemas/TeambuildSummary" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/teambuilds/{id}:
    get:
      summary: Récupérer un teambuild complet
      description: >
        Renvoie le document .zcx stocké, intact. Accepte l'id serveur ou le
        source_uuid (l'id du .zcx). L'ordre des clés peut différer de l'original ;
        le contenu sémantique est identique.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Document .zcx complet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZcxDocument" }
              examples:
                gvgSplit: { $ref: "#/components/examples/GvgSplit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Introuvable }
    put:
      summary: Créer ou remplacer un teambuild (sync fichier par fichier)
      description: >
        Corps = document .zcx brut. Upsert idempotent clé par (propriétaire, source_uuid) :
        création si absent ; no-op si le hash (hors updatedAt) est inchangé ;
        remplacement sinon. visibility en query, défaut private.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: source_uuid canonique minuscule }
        - { name: visibility, in: query, schema: { type: string, enum: [private, public], default: private } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZcxDocument" }
            examples:
              gvgSplit: { $ref: "#/components/examples/GvgSplit" }
      responses:
        "201":
          description: Créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpsertResult" }
        "200":
          description: Remplacé ou inchangé (voir created/changed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpsertResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Supprimer un de ses teambuilds
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Supprimé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Introuvable }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: players.api_token }
  responses:
    Unauthorized:
      description: Token absent ou invalide
    Forbidden:
      description: Build privé d'autrui ou écriture non autorisée
    BadRequest:
      description: JSON malformé ou identifiant invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorList" }
    Invalid:
      description: Violation des règles du format (cf. docs/zcx_format.md §11)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorList" }
  schemas:
    Pagination:
      type: object
      properties:
        page: { type: integer }
        perPage: { type: integer }
        totalCount: { type: integer }
    ErrorList:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string, examples: ["$.characters[0].skillIds"] }
              code:
                type: string
                enum: [malformed_json, invalid_source_uuid, not_an_object, wrong_case,
                       null_array, duplicate_attribute_id, invalid_skill_ids,
                       too_many_characters, max_depth]
              message: { type: string }
    TeambuildCharacterSummary:
      type: object
      properties:
        name: { type: string }
        primaryProfession: { type: integer, nullable: true, description: Id GW1 0-10 }
        secondaryProfession: { type: integer, nullable: true }
        eliteSkillId: { type: integer, nullable: true, description: SkillId GW1 officiel }
        assignment: { type: string }
        dominantAttribute: { type: string, nullable: true }
    TeambuildSummary:
      type: object
      properties:
        id: { type: integer }
        sourceId: { type: string, format: uuid }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        gameMode: { type: string }
        playerCount: { type: integer }
        visibility: { type: string, enum: [private, public] }
        characters: { type: array, items: { $ref: "#/components/schemas/TeambuildCharacterSummary" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpsertResult:
      allOf:
        - $ref: "#/components/schemas/TeambuildSummary"
        - type: object
          properties:
            created: { type: boolean }
            changed: { type: boolean }
    ZcxDocument:
      type: object
      additionalProperties: true
      description: >
        Document .zcx complet — cf. docs/zcx_format.md comme référence normative.
        Champs connus typés ci-dessous ; tout champ supplémentaire est toléré
        et préservé tel quel (versions futures du format).
      properties:
        version: { type: integer, description: Informatif, jamais routé }
        id: { type: string, format: uuid }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        characters:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/ZcxCharacter" }
        locks: { type: array, items: { type: object, additionalProperties: true } }
        spike: { type: array, items: { type: object, additionalProperties: true } }
        flux: { type: integer, minimum: 0, maximum: 12 }
        natureRituals: { type: array, items: { type: integer } }
        roaringWindsRank: { type: integer, minimum: 0, maximum: 20 }
        tranquilityRank: { type: integer, minimum: 0, maximum: 20 }
        gameMode: { type: string, enum: ["All", "PvE", "PvP", ""] }
        vampiricHits3: { type: integer, minimum: 0, maximum: 25 }
        vampiricHits5: { type: integer, minimum: 0, maximum: 25 }
    ZcxCharacter:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        primaryProfession: { type: integer, minimum: 0, maximum: 10 }
        secondaryProfession: { type: integer, minimum: 0, maximum: 10 }
        isFavorite: { type: boolean }
        assignment: { type: string }
        gender: { type: integer, enum: [0, 1] }
        skillIds:
          type: array
          minItems: 8
          maxItems: 8
          items: { type: integer }
          description: Emplacements 0-7 ; 0 = vide. Ids officiels GW1, inconnus tolérés.
        attributes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              points: { type: integer }
            required: [id, points]
          description: ids uniques au sein d'un même personnage (sinon rejet 422)
        titleRanks: { type: object, additionalProperties: { type: integer } }
        equipment: { type: object, additionalProperties: true, nullable: true }
        notes: { type: string }
        durationBoostersEnabled: { type: boolean }
        activeAttributeBoosts: { type: array, items: { type: integer } }
        variants: { type: array, items: { $ref: "#/components/schemas/ZcxCharacter" } }
  examples:
    GvgSplit:
      summary: Teambuild mono-personnage avec variante/cadenas/spike (format §12)
      value:
        version: 18
        id: 0f6a2f6c-9a1e-4b7d-9c3a-5f0e2b8c1d44
        name: GvG Split
        tags: [GvG, meta]
        notes: ""
        createdAt: "2026-08-21T09:30:00Z"
        updatedAt: "2026-08-21T17:05:12Z"
        characters:
          - id: 11111111-1111-1111-1111-111111111111
            name: Water Snare
            primaryProfession: 6
            secondaryProfession: 5
            isFavorite: true
            assignment: Midline
            gender: 1
            skillIds: [1010, 1011, 0, 919, 2, 1064, 3, 1]
            attributes:
              - { id: 11, points: 12 }
              - { id: 12, points: 10 }
              - { id: 3, points: 8 }
            titleRanks: { "Lightbringer rank": 8 }
            equipment:
              armor: [{ slot: 2, itemId: 76, dye: 10, modifierIds: [129, 205] }]
              weaponSets: [{ items: [{ slot: 0, itemId: 21, dye: 0, modifierIds: [47] }] }]
              activeSet: 0
            notes: "Élémentaliste eau & dégén."
            durationBoostersEnabled: false
            activeAttributeBoosts: []
            variants: []
        locks: [{ index: 1, color: "#FFD700", memberIds: ["11111111-1111-1111-1111-111111111111"] }]
        spike: []
        flux: 7
        natureRituals: [1156]
        roaringWindsRank: 12
        tranquilityRank: 12
        gameMode: PvP
        vampiricHits3: 1
        vampiricHits5: 1
